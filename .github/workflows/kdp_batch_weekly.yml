name: kdp-batch-weekly

# 週次 batch 生成の自動化。
#
# 設計厳守 (README / guardrails): GENERATION ONLY — このワークフローは Amazon/KDP
# その他外部サービスへ一切 publish しない。生成物 (output/) を artifact として置くだけで、
# DL → KDP 手動入稿は人間が行う。publish / KDP アップロードのステップは意図的に存在しない。
#
# やること:
#  1) sudoku と word-search を batch 生成 (output/ に PDF+metadata)。
#  2) output/ を artifact としてアップロード (retention 30日)。人間が DL して手動入稿。
#  3) state/kdp-factory.json の台帳更新のみ default ブランチへ commit
#     (output/ は .gitignore 対象なので commit されない)。

on:
  schedule:
    # 毎週月曜 22:00 UTC。GitHub Actions cron 遅延 (0-3h) は許容。
    - cron: '0 22 * * 1'
  workflow_dispatch:
    inputs:
      batch:
        description: '生成冊数 (各カテゴリごと)'
        required: false
        default: '10'
        type: string
      category:
        description: '対象カテゴリ (both | sudoku | word-search)'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - sudoku
          - word-search

permissions:
  contents: write

concurrency:
  group: kdp-batch-weekly
  cancel-in-progress: false

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        run: npm ci || npm install

      - name: Resolve inputs
        id: cfg
        run: |
          BATCH="${{ github.event.inputs.batch || '10' }}"
          CATEGORY="${{ github.event.inputs.category || 'both' }}"
          # batch は正の整数のみ許容 (不正なら 10 にフォールバック)
          case "$BATCH" in
            ''|*[!0-9]*) BATCH=10 ;;
          esac
          [ "$BATCH" -lt 1 ] && BATCH=10
          echo "batch=$BATCH" >> "$GITHUB_OUTPUT"
          echo "category=$CATEGORY" >> "$GITHUB_OUTPUT"
          echo "Resolved: batch=$BATCH category=$CATEGORY"

      - name: Generate batches (GENERATION ONLY — never publishes)
        id: gen
        run: |
          BATCH="${{ steps.cfg.outputs.batch }}"
          CATEGORY="${{ steps.cfg.outputs.category }}"
          CATS=""
          case "$CATEGORY" in
            both) CATS="sudoku word-search" ;;
            sudoku) CATS="sudoku" ;;
            word-search) CATS="word-search" ;;
            *) CATS="sudoku word-search" ;;
          esac
          TOTAL=0
          for c in $CATS; do
            echo "==== generating $BATCH $c book(s) ===="
            npx tsx src/cli.ts generate --batch "$BATCH" --category "$c"
            TOTAL=$((TOTAL + BATCH))
          done
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "categories=$CATS" >> "$GITHUB_OUTPUT"
          echo "Generated $TOTAL book(s) across: $CATS"

      # 生成物 (output/) は .gitignore 対象なので commit されない。
      # 人間が DL → KDP 手動入稿するため artifact として保存する。
      - name: Upload generated books (artifact for manual KDP submission)
        uses: actions/upload-artifact@v4
        with:
          name: kdp-books-${{ github.run_id }}
          path: output/
          retention-days: 30
          if-no-files-found: warn

      # 台帳 (state/kdp-factory.json) のみ commit。output/ は除外。
      - name: Commit state ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain state/kdp-factory.json)" ]; then
            git add state/kdp-factory.json
            git commit -m "chore(kdp): weekly batch ledger $(date -u +%Y-%m-%d) (+${{ steps.gen.outputs.total }} books)"
            for i in 1 2 3 4; do
              git push && break
              echo "push attempt $i failed; rebasing and retrying in $((2**i))s"
              git pull --rebase origin main || git pull --rebase origin master || true
              sleep $((2**i))
            done
          else
            echo "No ledger changes to commit."
          fi

      - name: Notify Telegram on success (optional)
        if: success()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="📚 kdp-factory: ${{ steps.gen.outputs.total }}冊生成しました (${{ steps.gen.outputs.categories }})。artifact から DL して KDP に手動入稿してください → ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true

      - name: Notify Telegram on failure (optional)
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="⚠️ kdp-factory weekly batch failed | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
